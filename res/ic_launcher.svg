<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1FB8A6"/>
      <stop offset="1" stop-color="#0E7C86"/>
    </linearGradient>
    <linearGradient id="film" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D7F5F0"/>
    </linearGradient>
  </defs>

  <!-- rounded background -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- compression arrows squeezing inward (point toward the frame) -->
  <g fill="#FFFFFF" opacity="0.92">
    <!-- top arrow pointing DOWN toward frame -->
    <path d="M256 150 l34 -40 h-22 v-34 h-24 v34 h-22 z"/>
    <!-- bottom arrow pointing UP toward frame -->
    <path d="M256 362 l34 40 h-22 v34 h-24 v-34 h-22 z"/>
  </g>

  <!-- video frame -->
  <rect x="126" y="170" width="260" height="172" rx="28" ry="28" fill="url(#film)"/>
  <!-- sprocket holes, left and right, evoking film -->
  <g fill="#0E7C86">
    <rect x="146" y="190" width="16" height="18" rx="4"/>
    <rect x="146" y="247" width="16" height="18" rx="4"/>
    <rect x="146" y="304" width="16" height="18" rx="4"/>
    <rect x="350" y="190" width="16" height="18" rx="4"/>
    <rect x="350" y="247" width="16" height="18" rx="4"/>
    <rect x="350" y="304" width="16" height="18" rx="4"/>
  </g>
  <!-- play triangle -->
  <path d="M236 212 l70 44 -70 44 z" fill="#0E7C86"/>
</svg>
